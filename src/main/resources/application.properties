spring.application.name=watchlog
spring.datasource.url=jdbc:h2:file:./data/watchlog;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base-url=https://image.tmdb.org/t/p
tmdb.api.read-access-token=${TMDB_READ_ACCESS_TOKEN:}
tmdb.api.language=ja-JP
tmdb.api.region=JP
